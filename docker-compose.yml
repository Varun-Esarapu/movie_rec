version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recommender-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recommender_db}
      POSTGRES_USER: ${POSTGRES_USER:-recommender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recommender_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recommender_user} -d ${POSTGRES_DB:-recommender_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recommender-django-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn recommender_core.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,django-backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  streamlit-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recommender-streamlit-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://django-backend:8000/api/v1
    depends_on:
      - django-backend

volumes:
  pgdata:
